project:
  type: website
  render:
    - "*.qmd"
    - "!en/"          # le sous-projet EN est rendu séparément

website:
  title: "Agnès Drouard | Data Analyst"
  description: "Data analyst freelance — analyse de données, dashboards et modélisation décisionnelle pour transformer vos données en décisions."
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: projects.qmd
        text: Projets
    right:
      - icon: globe
        menu:
          - text: "Français"
            href: index.qmd
          - text: "English"
            href: en/index.html
  page-footer:
    left: "© 2026 Agnès Drouard"
    right: Construit avec Quarto

format:
  html:
    lang: fr
    theme: flatly
    css: styles.css
    include-in-header:
      - fonts.html
      - fix-accessibility.html
    toc: true
    toc-title: "Sur cette page"

